<svg width="46" height="46" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <style>
    .animated-icon {
      animation: shake 1.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite;
      transform-origin: 12px 12px;
      will-change: transform;
